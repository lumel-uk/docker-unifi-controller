version: 0.2


env:
  shell: bash
  parameter-store:
    DOCKER_ACCOUNT: uk.co.lumel.credentials.docker_username
    DOCKER_ACCESS_TOKEN: uk.co.lumel.credentials.docker_pat

phases:
  pre_build:
    commands:
      - echo $DOCKER_ACCESS_TOKEN | docker login --username $DOCKER_ACCOUNT --password-stdin
      - echo Branch is $DOCKER_TAG

  build:
    commands:
      - docker build -t $DOCKER_ACCOUNT/unifi-controller:$DOCKER_TAG .

  post_build:
    commands:
      - scripts/tag_dev_latest_version.sh $DOCKER_ACCOUNT/unifi-controller $DOCKER_TAG
      - docker push --all-tags $DOCKER_ACCOUNT/unifi-controller
      - scripts/store_in_ecr.sh $DOCKER_ACCOUNT/unifi-controller $DOCKER_TAG


